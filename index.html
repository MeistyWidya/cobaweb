<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oma Opa POS - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8ed;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #4b2b1d;
        }

        /* =========================
           LOGIN CARD
        ========================== */

        .login-card {
            width: 100%;
            max-width: 390px;

            background: #fffdf9;

            border: 1px solid #eadfd2;
            border-radius: 10px;

            padding: 24px 22px 26px;

            box-shadow: 0 2px 8px rgba(80, 50, 30, 0.05);
        }

        /* =========================
           LOGO
        ========================== */

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 8px;

            margin-bottom: 12px;
        }

        .logo-icon {
            display: flex;
            gap: 2px;
        }

        .bread {
            width: 32px;
            height: 32px;

            background: #f7c66b;

            border-radius: 50% 50% 45% 45%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            border: 2px solid #d9a653;
        }

        .logo-text {
            font-size: 19px;
            font-weight: 800;
            line-height: 17px;

            color: #5a2d1c;
        }

        /* =========================
           TITLE
        ========================== */

        .welcome {
            text-align: center;

            margin-top: 6px;
            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 17px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .welcome p {
            font-size: 11px;
            color: #765f51;
        }

        /* =========================
           FORM
        ========================== */

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;

            font-size: 11px;
            font-weight: 500;

            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;

            height: 38px;

            padding: 0 12px;

            border: 1px solid #e8ddd2;
            border-radius: 6px;

            background: #fff;

            font-size: 11px;

            outline: none;

            color: #4b2b1d;
        }

        .form-input:focus {
            border-color: #f39a16;

            box-shadow: 0 0 0 2px rgba(243, 154, 22, 0.10);
        }

        .password-input {
            padding-right: 38px;
        }

        .eye {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            color: #8a796e;

            font-size: 14px;
        }

        /* =========================
           REMEMBER + FORGOT
        ========================== */

        .form-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-top: -3px;
            margin-bottom: 17px;
        }

        .remember {
            display: flex;
            align-items: center;

            gap: 5px;

            font-size: 10px;
        }

        .remember input {
            accent-color: #f39a16;

            width: 12px;
            height: 12px;
        }

        .forgot {
            font-size: 10px;

            color: #e87913;

            text-decoration: none;
        }

        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-button {
            width: 100%;

            height: 38px;

            border: none;
            border-radius: 6px;

            background: #f39a16;

            color: white;

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #e98b08;
        }

        .login-button:active {
            transform: scale(0.99);
        }

        /* =========================
           REGISTER
        ========================== */

        .register {
            text-align: center;

            margin-top: 22px;

            font-size: 10px;

            color: #654c40;
        }

        .register a {
            color: #e87913;

            font-weight: 600;

            text-decoration: none;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .login-card {
                max-width: 360px;

                padding: 22px 18px 24px;
            }
        }
    </style>
</head>


<body>

    <div class="login-card">

        <!-- LOGO -->
        <div class="logo">

            <div class="logo-icon">

                <div class="bread">🥯</div>
                <div class="bread">🥐</div>

            </div>

            <div class="logo-text">
                OMA<br>
                OPA
            </div>

        </div>


        <!-- WELCOME -->
        <div class="welcome">

            <h1>Selamat Datang!</h1>

            <p>
                Silakan masuk untuk melanjutkan
            </p>

        </div>


        <!-- EMAIL -->
        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="form-input"
                placeholder="kasir@omaopa.com"
            >

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="password"
                    class="form-input password-input"
                    placeholder="••••••••"
                >

                <span
                    class="eye"
                    onclick="togglePassword()"
                    id="eyeIcon"
                >
                    ◉
                </span>

            </div>

        </div>


        <!-- OPTIONS -->
        <div class="form-options">

            <label class="remember">

                <input
                    type="checkbox"
                    id="remember"
                >

                <span>Ingat saya</span>

            </label>


            <a href="#" class="forgot">
                Lupa password?
            </a>

        </div>


        <!-- LOGIN -->
        <button
            class="login-button"
            onclick="loginDemo()"
        >
            Masuk
        </button>


        <!-- REGISTER -->
        <div class="register">

            Belum punya akun?

            <a href="#">
                Daftar di sini
            </a>

        </div>

    </div>


    <script>

        /* =========================
           SHOW / HIDE PASSWORD
        ========================== */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eye =
                document.getElementById("eyeIcon");


            if (password.type === "password") {

                password.type = "text";

                eye.innerHTML = "◉";

            } else {

                password.type = "password";

                eye.innerHTML = "◉";
            }
        }


        /* =========================
           DEMO LOGIN
        ========================== */

        function loginDemo() {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            if (!email || !password) {

                alert("Email dan password harus diisi.");

                return;
            }


            alert(
                "Login berhasil (DEMO)!\n\n" +
                "Email: " + email
            );
        }

    </script>

</body>
</html>
